<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %} — OrbitBoard</title>
<style>
*{box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#080818;color:#9dc8e0;margin:0}
.nav{background:#050510;border-bottom:1px solid #1b3850;padding:10px 24px;
     display:flex;align-items:center;gap:18px}
.nav .logo{color:#00ccff;font-size:20px;font-weight:bold;flex:1;
           text-decoration:none}
.nav a{color:#4ab8e0;text-decoration:none;font-size:13px}
.nav a:hover{color:#00ccff}
.nav span{color:#5a8aa0;font-size:13px}
.wrap{max-width:820px;margin:32px auto;padding:0 20px}
h1,h2{color:#00ccff;margin-top:0}
.card{background:#0c1928;border:1px solid #1b3850;border-radius:5px;
      padding:16px;margin:12px 0}
.card h3{margin:0 0 8px;color:#4ab8e0;font-size:15px}
.card .dim{color:#3a6880;font-size:12px;margin-top:6px}
.card a{color:#4ab8e0;text-decoration:none}
input,textarea{background:#0a1525;color:#9dc8e0;border:1px solid #1b3850;
               padding:8px;border-radius:3px;font-family:inherit;
               width:100%;margin-top:4px}
textarea{resize:vertical;min-height:80px}
button,.btn{background:#0b2a44;color:#4ab8e0;border:1px solid #4ab8e0;
            padding:8px 18px;border-radius:3px;cursor:pointer;font-family:inherit}
button:hover{background:#1b3a54;color:#00ccff;border-color:#00ccff}
.error{color:#ff6666;background:#1a0a0a;border:1px solid #3a1010;
       border-radius:3px;padding:8px 12px;margin:8px 0}
.success{color:#66ff88;background:#0a1a0a;border:1px solid #104410;
         border-radius:3px;padding:8px 12px;margin:8px 0}
.lbl{color:#3a6880;font-size:12px;margin-bottom:2px;margin-top:10px}
hr{border:none;border-top:1px solid #1b3850;margin:20px 0}
code{background:#0a1525;padding:2px 6px;border-radius:3px;color:#00ccff}
</style>
</head>
<body>
<nav class="nav">
<a class="logo" href="/">📡 OrbitBoard</a>
{% if user %}
<span>👤 {{ user.name }} — {{ user.rank }}</span>
<a href="/logout">Odjava</a>
{% else %}
<a href="/login">Prijava</a>
{% endif %}
</nav>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
