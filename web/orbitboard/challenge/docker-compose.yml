name: orbitboard-chall
services:
  site:
    image: registry.vuln.si/ptr2026/web/orbitboard:latest
    build: ./app
    environment:
      FLAG: "flag{local_test_flag}"
      BOT_URL: "http://bot:3001"
      BOT_USERNAME: officer_vega
      BOT_PASSWORD: localbotpw
      PORT: "5000"
    ports:
      - "3000:5000"
  bot:
    image: registry.vuln.si/ptr2026/web/orbitboard:bot
    build: ./bot
    environment:
      SITE_URL: "http://site:5000"
      PORT: "3001"
      BOT_USERNAME: officer_vega
      BOT_PASSWORD: localbotpw
